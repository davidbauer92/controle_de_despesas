<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Controle de despesas pessoais mensal">
    <meta name="theme-color" content="#6c5ce7">
    <title>Controle de Despesas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Controle de Despesas</h1>
        <div id="auth-container" class="auth-container"></div>
    </header>
    
    <main>
        <div class="container-orcamento">
            <section id="infoSalario">
                <h2>Orçamento Familiar</h2>
                <div class="pessoas-container">
                    <div id="listaPessoas">
                        </div>
                    <button type="button" id="btnAdicionarPessoa" class="btn-adicionar">
                        <span>+</span> Adicionar Pessoa
                    </button>
                </div>
            </section>

            <section id="resumoDespesas">
                <h2>Resumo por Pessoa</h2>
                <div id="resumoPorPessoa">
                    </div>
            </section>
        </div>

        <form id="formDespesa">
            <div class="form-group">
                <label for="data">Data:</label>
                <input type="datetime-local" id="data" required>
            </div>
            
            <div class="form-group">
                <label for="tipo">Tipo:</label>
                <select id="tipo">
                    <option value="Fixa">Fixas</option>
                    <option value="Variavel">Variáveis</option>
                    <option value="Outras">Outras</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="descricao">Descrição:</label>
                <input type="text" id="descricao" required>
            </div>
            
            <div class="form-group">
                <label for="valor">Valor (R$):</label>
                <input type="number" id="valor" step="0.01" required>
            </div>
            
            <div class="form-buttons">
                <button type="submit" id="btnSalvar">Adicionar Despesa</button>
                <button type="button" id="btnCancelar" class="hidden">Cancelar</button>
            </div>
        </form>

        <section class="tabela-container">
            <h2>Despesas do Mês</h2>
            <table id="tabelaDespesas">
                <thead>
                    <tr>
                        <th class="sortable" data-coluna="data">Data <span class="ordem"></span></th>
                        <th class="sortable" data-coluna="tipo">Tipo de Despesa <span class="ordem"></span></th>
                        <th class="sortable" data-coluna="descricao">Descrição <span class="ordem"></span></th>
                        <th class="sortable" data-coluna="valor">Valor (R$) <span class="ordem"></span></th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </section>

        <section id="analiseOrcamento">
            <h2>Análise de Orçamento</h2>
            <div class="barra-progresso-container">
                <div class="barra-progresso">
                    <div class="progresso" id="barraCompromisso"></div>
                </div>
                <div class="info-progresso">
                    <p>Total Despesas: <span id="totalDespesas">R$ 0,00</span></p>
                    <p>Disponível: <span id="valorDisponivel">R$ 0,00</span></p>
                    <p>Total Familiar: <span id="exibeSalario">R$ 0,00</span></p>
                </div>
            </div>
            <div class="status-orcamento">
                <p id="statusMensagem">Adicione pessoas para ver análises</p>
            </div>
        </section>
    </main>

    <div id="modalPessoa" class="modal">
        <div class="modal-content">
            <h3>Adicionar Pessoa</h3>
            <form id="formPessoa">
                <div class="form-group">
                    <label for="nomePessoa">Nome:</label>
                    <input type="text" id="nomePessoa" required>
                </div>
                <div class="form-group">
                    <label for="salarioPessoa">Salário Mensal (R$):</label>
                    <input type="number" id="salarioPessoa" step="0.01" min="0" required>
                </div>
                <div class="modal-buttons">
                    <button type="submit">Salvar</button>
                    <button type="button" id="btnCancelarPessoa">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
    
    <div id="customConfirmModal" class="modal">
        <div class="modal-content">
            <h3 id="confirmModalMessage">Você tem certeza?</h3>
            <div class="modal-buttons">
                <button id="confirmModalBtnConfirm">Sim</button>
                <button id="confirmModalBtnCancel">Não</button>
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js"
            }
        }
    </script>
        
    <script src="script.js" type="module"></script>
</body>
</html>
